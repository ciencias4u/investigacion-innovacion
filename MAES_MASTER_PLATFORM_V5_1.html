<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I&I MASTER PLATFORM</title>
<link rel="icon"
href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<text y='0.9em' font-size='90'>🧠</text>
</svg>">
<style>
body{
font-family:'Segoe UI',Arial,sans-serif;
background:#eef2f7;
margin:0;
color:#222;
}

header{
background:linear-gradient(135deg,#123a72,#1d5bb8);
color:white;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

header h1{
margin:0;
font-size:28px;
}

main{
padding:20px;
max-width:1400px;
margin:auto;
}

.card{
background:white;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.stat{
font-size:34px;
font-weight:bold;
color:#123a72;
}

button:not(.option){
background:#123a72;
color:white;
border:none;
border-radius:8px;
padding:10px 15px;
cursor:pointer;
transition:.25s;
}

button:hover{
background:#1d5bb8;
transform:translateY(-2px);
}

select{
padding:8px;
border-radius:8px;
border:1px solid #ccc;
}

.option{
display:block;
width:100%;
text-align:left;
margin:8px 0;
padding:12px;
border:1px solid #d9e2ef;
border-radius:8px;
background:#f5f7fb;
color:#222;
cursor:pointer;
transition:.2s;
font-size:15px;
}

.option:hover{
background:#dce8ff;
border-color:#123a72;
color:#123a72;
}

#quiz h3{
color:#123a72;
}

#infoSimulacro{
background:#eef6ff;
padding:12px;
border-radius:10px;
margin-bottom:15px;
}
.card-mini{
background:#f7f9fc;
padding:15px;
border-radius:12px;
text-align:center;
border:1px solid #e3e8f0;
transition:.2s;
}

.card-mini:hover{
transform:translateY(-2px);
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.configuracion{
display:flex;
flex-wrap:wrap;
gap:10px;
align-items:center;
}

#temas{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-bottom:15px;
}

#temas label{
background:#f7f9fc;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
border:1px solid #dfe6ef;
}

#quiz{
min-height:250px;
}

#quiz h3{
font-size:24px;
line-height:1.4;
color:#123a72;
margin-bottom:20px;
}

header p{
margin-top:8px;
opacity:.85;
font-size:19px;
}

#progreso{
font-weight:bold;
color:#123a72;
margin-bottom:10px;
}

#nota{
color:#0f7d34;
}

#barraContainer{
height:10px;
background:#ddd;
border-radius:10px;
margin-bottom:10px;
overflow:hidden;
}

#barra{
height:100%;
width:0%;
background:#123a72;
transition:.3s;
}
</style>
</head>
<body>
<header><h1>🧠  I&I MASTER PLATFORM</h1>
<p>Simulador I&I · Banco de preguntas · Banco de errores · Estadísticas</p></header>

<main>
<div class="card">
<h2>Dashboard</h2>

<div class="grid">

<div class="card-mini">
<div class="stat" id="total">0</div>
<div>Preguntas</div>
</div>

<div class="card-mini">
<div class="stat" id="aciertos">0</div>
<div>Aciertos</div>
</div>

<div class="card-mini">
<div class="stat" id="porcentaje">0%</div>
<div>% Acierto</div>
</div>

<div class="card-mini">
<div class="stat" id="tiempo">00:00</div>
<div>Tiempo</div>
</div>

<div class="card-mini">
<div class="stat" id="errores">0</div>
<div>Errores</div>
</div>

<div class="card-mini">
<div class="stat" id="nota">0.00</div>
<div>Nota MAES</div>
</div>

<div class="card-mini">
<div class="stat" id="respondidas">0</div>
<div>Respondidas</div>
</div>

<div class="card-mini">
<div class="stat" id="numFallos">0</div>
<div>Banco errores</div>
</div>

</div>
</div>

<div class="card">
<h2>Configuración</h2>
<div id="estadoActual"></div>
<div id="temas">
<label><input type="checkbox" value="Tema 1" checked>Tema 1</label>
<label><input type="checkbox" value="Tema 2" checked>Tema 2</label>
<label><input type="checkbox" value="Tema 3" checked>Tema 3</label>
<label><input type="checkbox" value="Tema 4" checked>Tema 4</label>
<label><input type="checkbox" value="Tema 5" checked>Tema 5</label>
<label><input type="checkbox" value="Tema 6" checked>Tema 6</label>
<label><input type="checkbox" value="Tema 9" checked>Tema 9</label>
<label><input type="checkbox" value="Tema 10" checked>Tema 10</label>
</div>
<div class="configuracion">
<select id="dif">
  <option value="0">Todos los niveles</option>
  <option>1</option>
  <option>2</option>
  <option>3</option>
  <option>4</option>
  <option>5</option></select>

<select id="cantidad">
  <option>10</option>
  <option>20</option>
  <option>50</option>
</select>

<button onclick="iniciar()">Iniciar simulacro</button>
<button onclick="repasar()">Repasar errores</button>
<button onclick="resetear()">Resetear estadísticas</button>
<button onclick="seleccionarTodo()">Seleccionar todo</button>
<button onclick="deseleccionarTodo()">Quitar todas las selecciones</button>
</div>
</div>
<div id="infoSimulacro"></div>
<div id="progreso"></div>
<div id="quiz" class="card"></div>
<div id="barraContainer">
<div id="barra"></div>
</div>

</main>

<script src="preguntasTema1_B1.js"></script>
<script src="preguntasTema1_B2.js"></script>
<script src="preguntasTema2_B1.js"></script>
<script src="preguntasTema2_B2.js"></script>
<script src="preguntasTema2_B3.js"></script>
<script src="preguntasTema2_B4.js"></script>
<script src="preguntasTema2_B5.js"></script>
<script src="preguntasTema2_B6.js"></script>
<script src="preguntasTema2_B7.js"></script>
<script src="preguntasTema3_B1.js"></script>
<script src="preguntasTema3_B2.js"></script>
<script src="preguntasTema3_B3.js"></script>
<script src="preguntasTema3_B4.js"></script>
<script src="preguntasTema3_B5.js"></script>
<script src="preguntasTema3_B6.js"></script>
<script src="preguntasTema3_B7.js"></script>
<script src="preguntasTema3_B8.js"></script>
<script src="preguntasTema4_B1.js"></script>
<script src="preguntasTema4_B2.js"></script>
<script src="preguntasTema4_B3.js"></script>
<script src="preguntasTema4_B4.js"></script>
<script src="preguntasTema4_B5.js"></script>
<script src="preguntasTema4_B6.js"></script>
<script src="preguntasTema4_B7.js"></script>
<script src="preguntasTema5_B1.js"></script>
<script src="preguntasTema5_B2.js"></script>
<script src="preguntasTema5_B3.js"></script>
<script src="preguntasTema5_B4.js"></script>
<script src="preguntasTema5_B5.js"></script>
<script src="preguntasTema5_B6.js"></script>
<script src="preguntasTema5_B7.js"></script>
<script src="preguntasTema6_B1.js"></script>
<script src="preguntasTema6_B2.js"></script>
<script src="preguntasTema6_B3.js"></script>
<script src="preguntasTema6_B4.js"></script>
<script src="preguntasTema6_B5.js"></script>
<script src="preguntasTema6_B6.js"></script>
<script src="preguntasTema6_B7.js"></script>
<script src="preguntasTema9_B1.js"></script>
<script src="preguntasTema9_B2.js"></script>
<script src="preguntasTema9_B3.js"></script>
<script src="preguntasTema9_B4.js"></script>
<script src="preguntasTema9_B5.js"></script>
<script src="preguntasTema9_B6.js"></script>
<script src="preguntasTema9_B7.js"></script>
<script src="preguntasTema9_B8.js"></script>
<script src="preguntasTema10_B1.js"></script>
<script src="preguntasTema10_B2.js"></script>
<script src="preguntasTema10_B3.js"></script>
<script src="preguntasTema10_B4.js"></script>
<script src="preguntasTema10_B5.js"></script>
<script src="preguntasTema10_B6.js"></script>
<script src="preguntasTema10_B7.js"></script>
<script src="preguntasTema10_B8.js"></script>
<script src="preguntasTema10_B9.js"></script>
<script>

const bancoPreguntas = [
  ...preguntasTema1_B1,
  ...preguntasTema1_B2,
  ...preguntasTema2_B1,
  ...preguntasTema2_B2,
  ...preguntasTema2_B3,
  ...preguntasTema2_B4,
  ...preguntasTema2_B5,
  ...preguntasTema2_B6,
  ...preguntasTema2_B7,
  ...preguntasTema3_B1,
  ...preguntasTema3_B2,
  ...preguntasTema3_B3,
  ...preguntasTema3_B4,
  ...preguntasTema3_B5,
  ...preguntasTema3_B6,
  ...preguntasTema3_B7,
  ...preguntasTema3_B8,
  ...preguntasTema4_B1,
  ...preguntasTema4_B2,
  ...preguntasTema4_B3,
  ...preguntasTema4_B4,
  ...preguntasTema4_B5,
  ...preguntasTema4_B6,
  ...preguntasTema4_B7,
  ...preguntasTema5_B1,
  ...preguntasTema5_B2,
  ...preguntasTema5_B3,
  ...preguntasTema5_B4,
  ...preguntasTema5_B5,
  ...preguntasTema5_B6,
  ...preguntasTema5_B7,
  ...preguntasTema6_B1,
  ...preguntasTema6_B2,
  ...preguntasTema6_B3,
  ...preguntasTema6_B4,
  ...preguntasTema6_B5,
  ...preguntasTema6_B6,
  ...preguntasTema6_B7,
  ...preguntasTema9_B1,
  ...preguntasTema9_B2,
  ...preguntasTema9_B3,
  ...preguntasTema9_B4,
  ...preguntasTema9_B5,
  ...preguntasTema9_B6,
  ...preguntasTema9_B7,
  ...preguntasTema9_B8,
  ...preguntasTema10_B1,
  ...preguntasTema10_B2,
  ...preguntasTema10_B3,
  ...preguntasTema10_B4,
  ...preguntasTema10_B5,
  ...preguntasTema10_B6,
  ...preguntasTema10_B7,
  ...preguntasTema10_B8,
  ...preguntasTema10_B9

];

document.getElementById('total').textContent=bancoPreguntas.length;

let simulacro=[],i=0,ac=0,er=0,fallos=[];
let inicioSimulacro;
let cronometro;
let opcionesActuales = [];
const letras=["A","B","C","D"];

function mezclar(array){
 for(let i=array.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
  [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

function iniciar(){
 const dif=document.getElementById('dif').value;
 const temasSeleccionados =
[...document.querySelectorAll('#temas input:checked')]
.map(c=>c.value);
 const cant=parseInt(document.getElementById('cantidad').value);
document.getElementById("estadoActual").innerHTML=
`
📚 ${temasSeleccionados.join(", ")}
 · ${cant} preguntas
`;
 let pool=bancoPreguntas.filter(q=>
 temasSeleccionados.includes(q.tema) &&
 (dif==='0'||String(q.dificultad)===dif)
 );
 document.getElementById("infoSimulacro")
.innerHTML =
`
<strong>Temas seleccionados:</strong>
${temasSeleccionados.join(", ")}
<br>
<strong>Preguntas:</strong> ${cant}
`;

 simulacro = mezclar([...pool]).slice(0,cant);
 i=0;
 inicioSimulacro = Date.now();

 clearInterval(cronometro);

 cronometro = setInterval(actualizarTiempo,1000);  
 mostrar();
}

function mostrar(){
 if(i>=simulacro.length){
    document.getElementById('quiz').innerHTML=
    `
    <h2>🎉 Simulacro finalizado</h2>

    <p>
    Aciertos: ${ac}
    </p>

    <p>
    Errores: ${er}
    </p>

    <p>
    Nota MAES: ${((ac*0.25)-(er*0.125)).toFixed(2)}
    </p>
    `;
    clearInterval(cronometro);
    return;
  }
 let q=simulacro[i];
 opcionesActuales =
 q.opciones.map((texto,indice)=>({
 texto:texto,
 original:indice
}));

opcionesActuales =
mezclar([...opcionesActuales]);
 let h='<h3>'+q.pregunta+'</h3>';
  opcionesActuales.forEach((o,idx)=>
  h+=
  `
  <button class="option"
  onclick="resp(${idx})">
  ${letras[idx]}) ${o.texto}
  </button>
  `
  );
 document.getElementById('quiz').innerHTML=h;
 document.getElementById("progreso").innerHTML =
`
Pregunta ${i+1} de ${simulacro.length}
`;
document.getElementById("barra").style.width =
((i/simulacro.length)*100)+"%";
}

function actualizarTiempo(){

 const segundos =
 Math.floor(
   (Date.now()-inicioSimulacro)/1000
 );

 const min =
 String(Math.floor(segundos/60))
 .padStart(2,'0');

 const seg =
 String(segundos%60)
 .padStart(2,'0');

 document.getElementById("tiempo")
 .textContent =
 `${min}:${seg}`;
}

function resp(r){
 let q = simulacro[i];

 const botones =
 document.querySelectorAll('.option');

 botones.forEach(btn =>
   btn.disabled = true
 );

 if(opcionesActuales[r].original === q.correcta){

   ac++;

   botones[r].style.background =
   "#d4edda";

   botones[r].style.color =
   "#155724";

 }else{

   er++;
   fallos.push(q);

   botones[r].style.background =
   "#f8d7da";

   botones[r].style.color =
   "#721c24";

   botones[q.correcta].style.background =
   "#d4edda";

   botones[q.correcta].style.color =
   "#155724";
 }

 document.getElementById('aciertos').textContent = ac;
 document.getElementById('errores').textContent = er;

 const respondidas =
 ac + er;

 const porcentaje =
 respondidas===0
 ? 0
 : (ac/respondidas)*100;

document.getElementById("porcentaje")
.textContent =
 porcentaje.toFixed(1)+"%";

document.getElementById("respondidas")
.textContent =
 respondidas;

 const nota =
 ((ac*0.25)-(er*0.125));

 const notaElem =
 document.getElementById("nota");

 notaElem.textContent =
 nota.toFixed(2);

 notaElem.style.color =
 nota >= 5
 ? "#0f7d34"
 : "#c0392b";

 setTimeout(()=>{

   i++;
   mostrar();

 },1000);

 document.getElementById("numFallos").textContent = fallos.length;

}

function repasar(){
 simulacro=[...fallos];
 i=0;
 mostrar();
}

function seleccionarTodo(){
document
.querySelectorAll('#temas input')
.forEach(c=>c.checked=true);
}

function deseleccionarTodo(){
document
.querySelectorAll('#temas input')
.forEach(c=>c.checked=false);
}

function resetear(){
 ac=0;
 er=0;
 i=0;

 simulacro=[];
 fallos=[];

 document.getElementById('aciertos').textContent=0;
 document.getElementById('errores').textContent=0;
 document.getElementById("aciertos").style.color =
"#0f7d34";

document.getElementById("errores").style.color =
"#c0392b";
 document.getElementById('nota').textContent="0.00";
 document.getElementById('nota').style.color="#123a72";

 document.getElementById('quiz').innerHTML=
 '<h3>Estadísticas reiniciadas</h3>';
 document.getElementById('infoSimulacro').innerHTML = '';
 document.getElementById("respondidas").textContent="0";
 document.getElementById("porcentaje").textContent="0%";
 document.getElementById("tiempo").textContent="00:00";
 clearInterval(cronometro);
}
</script>

text-align:center;
